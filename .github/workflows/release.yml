name: Build and release

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      moby-tag:
        description: >-
          moby tag to build, e.g. docker-v29.9.0 (defaults to the latest moby release). It is only released if
          it hasn't been already and the workflow runs on the default branch; otherwise it is built and tested.
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  MOBY_REPO: moby/moby
  ARTIFACT_NAME: docker-windows-arm64
  INSTALLER_ARTIFACT_NAME: docker-windows-arm64-setup

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      is-latest: ${{ steps.resolve.outputs.is-latest }}
      build: ${{ steps.resolve.outputs.build }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Resolve moby release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.moby-tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest=$(gh release view --repo "$MOBY_REPO" --json tagName --jq .tagName)
          tag="${REQUESTED_TAG:-$latest}"
          if [ -z "$(git ls-remote --tags "https://github.com/$MOBY_REPO.git" "refs/tags/$tag")" ]; then
            echo "::error::Tag $tag does not exist in $MOBY_REPO"
            exit 1
          fi
          echo "moby tag: $tag (latest: $latest)"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release=false
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Release $tag already exists; building and testing it without releasing." | tee -a "$GITHUB_STEP_SUMMARY"
              build=true
            else
              echo "Release $tag already exists; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              build=false
            fi
          elif [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Building and testing $tag without releasing it, because $GITHUB_REF is not the default branch." | tee -a "$GITHUB_STEP_SUMMARY"
            build=true
            release=false
          else
            echo "Building and releasing $tag." | tee -a "$GITHUB_STEP_SUMMARY"
            build=true
            release=true
          fi

          {
            echo "tag=$tag"
            echo "version=$(echo "$tag" | sed -E 's/^(docker-)?v//')"
            echo "is-latest=$([ "$tag" = "$latest" ] && echo true || echo false)"
            echo "build=$build"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: windows-11-arm
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: setup-moby

      - name: Clone moby
        shell: pwsh
        run: |
          #Requires -Version 7.4
          $PSNativeCommandUseErrorActionPreference = $true
          git config --global core.longpaths true
          git -c advice.detachedHead=false clone --depth 1 --branch '${{ needs.check.outputs.tag }}' "https://github.com/$env:MOBY_REPO.git" moby

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: moby/go.mod
          cache: false

      - name: Build Docker client and daemon
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          #Requires -Version 7.4
          $PSNativeCommandUseErrorActionPreference = $true
          go install github.com/tc-hib/go-winres@latest
          $env:GOPATH = go env GOPATH
          $env:Path += ";$env:GOPATH\bin"
          Set-Location moby
          ./hack/make.ps1 -Client -Daemon
          New-Item -ItemType Directory -Force -Path ..\docker-bin | Out-Null
          Copy-Item bundles\*.exe ..\docker-bin\
          Get-ChildItem ..\docker-bin

      - name: Upload Docker binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: docker-bin/*.exe
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          #Requires -Version 7.4
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          # makensis resolves relative paths from the script's directory.
          makensis /V2 /WX "/DVERSION=$env:VERSION" "/DBINDIR=$PWD\docker-bin" "/DOUTFILE=$PWD\installer\$env:INSTALLER_ARTIFACT_NAME.exe" setup-moby\installer\moby.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: installer/*.exe
          if-no-files-found: error

  test:
    needs: [check, build]
    uses: ./.github/workflows/test.yml
    with:
      artifact-name: docker-windows-arm64
      installer-artifact-name: docker-windows-arm64-setup
      expected-version: ${{ needs.check.outputs.version }}

  release:
    runs-on: ubuntu-latest
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download Docker binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: docker-bin

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: .

      - name: Package binaries
        run: |
          (cd docker-bin && zip -9 -j "../$ARTIFACT_NAME.zip" ./*.exe)
          sha256sum "$ARTIFACT_NAME.zip" > "$ARTIFACT_NAME.zip.sha256"
          sha256sum "$INSTALLER_ARTIFACT_NAME.exe" > "$INSTALLER_ARTIFACT_NAME.exe.sha256"
          cat "$ARTIFACT_NAME.zip.sha256" "$INSTALLER_ARTIFACT_NAME.exe.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          IS_LATEST: ${{ needs.check.outputs.is-latest }}
        run: |
          notes="Windows ARM64 build of moby [$TAG](https://github.com/$MOBY_REPO/releases/tag/$TAG).

          \`$INSTALLER_ARTIFACT_NAME.exe\` installs it and starts it as the \`docker\` service; \`$ARTIFACT_NAME.zip\` contains just the binaries.

          Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "$notes" \
            --latest="$IS_LATEST" \
            "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME.zip.sha256" \
            "$INSTALLER_ARTIFACT_NAME.exe" "$INSTALLER_ARTIFACT_NAME.exe.sha256"
