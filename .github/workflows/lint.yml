name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  YQ_VERSION: v4.54.1

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP" actionlint

      - name: Run actionlint
        # Uses the shellcheck preinstalled on the runner to check bash steps.
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          "$RUNNER_TEMP/actionlint"

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install yq
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          #Requires -Version 7.4
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          #Requires -Version 7.4
          $PSNativeCommandUseErrorActionPreference = $true
          ./.github/scripts/Invoke-PSScriptAnalyzer.ps1
